<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evillyn &amp; Maicon · Convidados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F8EAE7; --surface:#FFFBFA; --sunk:#F0DCD8; --ink:#4A2E2B; --muted:#8A6964; --line:#E8CFCA;
  --accent:#8E5048; --accent-ink:#FFFFFF; --accent-soft:#F2DCD8; --gold:#A6685F;
  --ok:#4C8566; --ok-soft:#E2EFE7; --wait:#9C7429; --wait-soft:#F6ECD8; --no:#B04E57; --no-soft:#F8E0E2;
  --script:"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
  --serif:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1416; --surface:#261C1E; --sunk:#302427; --ink:#F6E7E4; --muted:#C2A39E; --line:#3E2E30;
    --accent:#E8B4AB; --accent-ink:#2B1A1C; --accent-soft:#432D30; --gold:#D69A8F;
    --ok:#8FCFA8; --ok-soft:#1E3127; --wait:#E2C47E; --wait-soft:#3A2F18; --no:#F0A0A7; --no-soft:#432429;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1416; --surface:#261C1E; --sunk:#302427; --ink:#F6E7E4; --muted:#C2A39E; --line:#3E2E30;
    --accent:#E8B4AB; --accent-ink:#2B1A1C; --accent-soft:#432D30; --gold:#D69A8F;
    --ok:#8FCFA8; --ok-soft:#1E3127; --wait:#E2C47E; --wait-soft:#3A2F18; --no:#F0A0A7; --no-soft:#432429;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 120px}

/* Cabeçalho */
.hero{padding:28px 0 18px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.status[data-s="pending"] i,.status[data-s="saving"] i{background:var(--wait)}
.status[data-s="ro"] i,.status[data-s="err"] i{background:var(--no)}
.names{margin:14px 0 20px;text-align:center}
.names img{display:block;width:min(64vw,300px);height:auto;margin:0 auto}
.names .cap{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,6.4vw,32px);color:var(--accent);margin-top:6px;letter-spacing:.01em}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.bar span{display:block;height:100%;transition:width .4s ease}
.bar .b-ok{background:var(--ok)} .bar .b-no{background:var(--no)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:15px}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}
.legend .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* Barra de busca fixa */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none;min-width:0}
.search .clear{border:0;background:none;color:var(--muted);padding:6px;font-size:18px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:10px}
.more[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.field select,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--ink);width:100%}
.field textarea{min-height:76px;resize:vertical}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 4px;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}

/* Lista */
.letter{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--gold);padding:16px 2px 4px}
ul.list{list-style:none;margin:0;padding:0}
.g{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.g-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 2px;display:flex;flex-direction:column;gap:2px}
.g-name{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-meta{font-size:13.5px;color:var(--muted)}
.g-flags{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted);margin-top:2px}.g-flags span{white-space:nowrap}
.g-flags .on{color:var(--ok)}
.rsvp{flex:none;border:0;border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600;min-width:104px;background:var(--wait-soft);color:var(--wait)}
.rsvp[data-s="Confirmado"]{background:var(--ok-soft);color:var(--ok)}
.rsvp[data-s="Não vai"]{background:var(--no-soft);color:var(--no)}
.rsvp:disabled{cursor:default}
.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}

/* Resumo */
.sum h2{font-family:var(--serif);font-weight:600;font-size:30px;margin:30px 0 8px;color:var(--accent)}
.sum p.note{color:var(--muted);font-size:14px;margin:6px 0 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
thead th{font-size:13px;color:var(--muted);font-weight:500}
tbody tr:last-child td{border-bottom:0}
tr.tot td{font-weight:600;background:var(--sunk)}
td input.price{width:84px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:15px}
.pill-list{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pill-list li{padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
.pill-list li:last-child{border-bottom:0}
.pill-list small{display:block;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--no);border-color:var(--no-soft);background:transparent}
.btn.danger.armed{background:var(--no);color:#fff;border-color:var(--no)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* Navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.tab{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--sunk)}
.add{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.add[hidden]{display:none}

/* Folha (modal) */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(46,24,24,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .22s ease}
.scrim.show .sheet{transform:none}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;padding-bottom:20px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 14px;line-height:1.1}
.form{display:grid;gap:14px}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.rs button[aria-pressed="true"][data-v="Confirmado"]{background:var(--ok);color:#fff}
.seg.rs button[aria-pressed="true"][data-v="Não vai"]{background:var(--no);color:#fff}
.seg.rs button[aria-pressed="true"][data-v="Pendente"]{background:var(--wait);color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink)}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{left:23px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wa{font-size:13.5px;color:var(--accent);font-weight:600;text-decoration:none}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.ro-note{background:var(--wait-soft);color:var(--wait);border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.more{grid-template-columns:1fr 1fr}.rsvp{min-width:94px;padding:8px 10px}}
</style>

var CSS_SRC=document.getElementById('css').textContent;
var APP_SRC=document.getElementById('app').textContent;
var S=JSON.parse(document.getElementById('state').textContent);

var CATS=["Família Maicon","Família Evillyn","Amigos Maicon","Amigos Evillyn","Trabalho Maicon","Trabalho Evillyn","Madrinha & Padrinhos"];
var FAIXAS=["Adulto","Criança até 12 anos","Criança até 7 anos"];
var RESPS=["Evillyn","Maicon"];
var RSVPS=["Pendente","Confirmado","Não vai"];
var LS_KEY="convidados-evillyn-maicon-v1";

var mode="unknown", art=null, readOnly=false, dirty=false, timer=null, retried=false;
var ui={tab:"lista",q:"",resp:"Todos",rsvp:"Todos",cat:"Todas",faixa:"Todas",std:"Todos",conv:"Todos",more:false};
var sheetOpen=false;

try{var st=sessionStorage.getItem("cv-ui"); if(st){var o=JSON.parse(st); for(var k in o) if(k in ui) ui[k]=o[k]; ui._scroll=o._scroll||0;}}catch(e){}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function fmtBRL(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function pct(a,b){return b? (a/b*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%":"0%"}
function uid(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sorted(){return S.guests.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"})})}

/* ---------- Persistência ---------- */
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n"+HEAD+"<style id=\"css\">"+CSS_SRC+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script id=\"state\" type=\"application/json\">"+json+"<\/script>\n<script id=\"app\">"+APP_SRC+"<\/script>\n</body>\n</html>\n";
}
function stashUI(){try{var o=Object.assign({},ui,{_scroll:window.scrollY});sessionStorage.setItem("cv-ui",JSON.stringify(o))}catch(e){}}
function setStatus(s){
  var el=$("#status"); if(!el) return;
  var t={saved: mode==="local"?"Salvo neste aparelho":"Tudo salvo",pending:"Alterações a salvar",saving:"Salvando…",ro:"Somente leitura",err:"Não foi possível salvar"}[s];
  el.dataset.s=s; el.lastChild.textContent=t;
}
function changed(){
  if(readOnly) return;
  dirty=true;
  if(mode==="local"){saveLocal();return}
  setStatus("pending"); schedule(1800);
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(function(){flush(false)},ms)}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));dirty=false;setStatus("saved")}catch(e){setStatus("err")}}
function flush(force){
  if(!dirty||readOnly) return;
  if(mode==="unknown"){schedule(1000);return}
  if(mode==="local"){saveLocal();return}
  if(sheetOpen&&!force){schedule(1500);return}
  setStatus("saving"); stashUI();
  art.publish(buildDoc()).then(function(){dirty=false;setStatus("saved")},function(err){
    var c=err&&err.code;
    if(c==="conflict") return;
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){readOnly=true;setStatus("ro");render();toast("Esta visualização é somente leitura. As alterações não foram salvas.");return}
    if(c==="rate_limited"){schedule(8000);return}
    if(!retried){retried=true;schedule(1500+Math.random()*1500);return}
    setStatus("err");
  });
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden") flush(true)});

function initStore(){
  var c=window.claude;
  if(!c||typeof c.use!=="function"){useLocal();return}
  c.use("artifact").then(function(a){ if(a){art=a;mode="artifact";setStatus(dirty?"pending":"saved"); if(dirty) schedule(800)} else useLocal() },function(){useLocal()});
}
function useLocal(){
  mode="local";
  try{var raw=localStorage.getItem(LS_KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.guests)){ if(!dirty){S=d} }}}catch(e){}
  if(dirty) saveLocal(); else setStatus("saved");
  render();
}

/* ---------- Filtros ---------- */
function passes(g,skip){
  if(ui.q){var q=norm(ui.q); if(norm(g.nome+" "+(g.obs||"")+" "+(g.mesa||"")).indexOf(q)<0) return false}
  if(skip!=="resp"&&ui.resp!=="Todos"&&g.resp!==ui.resp) return false;
  if(skip!=="rsvp"&&ui.rsvp!=="Todos"&&g.rsvp!==ui.rsvp) return false;
  if(ui.cat!=="Todas"&&g.cat!==ui.cat) return false;
  if(ui.faixa!=="Todas"&&g.faixa!==ui.faixa) return false;
  if(ui.std!=="Todos"&&(ui.std==="Sim")!==!!g.std) return false;
  if(ui.conv!=="Todos"&&(ui.conv==="Sim")!==!!g.conv) return false;
  return true;
}
function filtersActive(){return ui.q||ui.resp!=="Todos"||ui.rsvp!=="Todos"||ui.cat!=="Todas"||ui.faixa!=="Todas"||ui.std!=="Todos"||ui.conv!=="Todos"}
function advCount(){var n=0;if(ui.cat!=="Todas")n++;if(ui.faixa!=="Todas")n++;if(ui.std!=="Todos")n++;if(ui.conv!=="Todos")n++;return n}

/* ---------- Render ---------- */
function counts(list){var c={Confirmado:0,Pendente:0,"Não vai":0};list.forEach(function(g){c[g.rsvp]=(c[g.rsvp]||0)+1});return c}

function heroHTML(){
  var n=S.guests.length,c=counts(S.guests);
  var w=function(x){return n?(x/n*100):0};
  return '<header class="hero"><div class="hero-top"><span>Lista de convidados</span><span class="status" id="status" data-s="saved"><i></i><span>…</span></span></div>'+
  '<h1 class="names"><img src="'+LOGO+'" alt="" width="692" height="720"><span class="cap">Evillyn &amp; Maicon</span></h1>'+
  '<div class="bar" role="img" aria-label="'+c.Confirmado+' confirmados, '+c.Pendente+' pendentes, '+c["Não vai"]+' não vão"><span class="b-ok" style="width:'+w(c.Confirmado)+'%"></span><span class="b-no" style="width:'+w(c["Não vai"])+'%"></span></div>'+
  '<div class="legend"><span><span class="k" style="background:var(--ok)"></span><b>'+c.Confirmado+'</b> confirmados</span><span><span class="k" style="background:var(--sunk);outline:1px solid var(--line)"></span><b>'+c.Pendente+'</b> pendentes</span><span><span class="k" style="background:var(--no)"></span><b>'+c["Não vai"]+'</b> não vão</span><span><b>'+n+'</b> no total</span></div>'+
  (readOnly?'<p class="ro-note">Você está vendo esta lista sem permissão para editar.</p>':'')+
  '</header>';
}

function chip(group,val,label,n){
  return '<button class="chip" data-f="'+group+'" data-v="'+esc(val)+'" aria-pressed="'+(ui[group]===val)+'">'+esc(label)+(n!=null?'<span class="n">'+n+'</span>':'')+'</button>';
}
function opts(list,cur,all){return [all].concat(list).map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join("")}

function filHTML(){
  var byResp=function(r){return S.guests.filter(function(g){return (r==="Todos"||g.resp===r)&&passes(g,"resp")}).length};
  var byRsvp=function(r){return S.guests.filter(function(g){return (r==="Todos"||g.rsvp===r)&&passes(g,"rsvp")}).length};
  var ac=advCount();
  return '<div class="chips">'+chip("resp","Todos","Todos",byResp("Todos"))+chip("resp","Evillyn","Evillyn",byResp("Evillyn"))+chip("resp","Maicon","Maicon",byResp("Maicon"))+
   '<span class="sep"></span>'+chip("rsvp","Pendente","Pendentes",byRsvp("Pendente"))+chip("rsvp","Confirmado","Confirmados",byRsvp("Confirmado"))+chip("rsvp","Não vai","Não vão",byRsvp("Não vai"))+
   '<span class="sep"></span><button class="chip" data-act="more" aria-pressed="'+(ui.more||ac>0)+'" aria-expanded="'+ui.more+'">Mais filtros'+(ac?'<span class="n">'+ac+'</span>':'')+'</button></div>'+
   '<div class="more" '+(ui.more?'':'hidden')+'>'+
   '<label class="field">Categoria<select data-sel="cat">'+opts(CATS,ui.cat,"Todas")+'</select></label>'+
   '<label class="field">Faixa etária<select data-sel="faixa">'+opts(FAIXAS,ui.faixa,"Todas")+'</select></label>'+
   '<label class="field">Save the Date enviado<select data-sel="std">'+opts(["Sim","Não"],ui.std,"Todos")+'</select></label>'+
   '<label class="field">Convite formal enviado<select data-sel="conv">'+opts(["Sim","Não"],ui.conv,"Todos")+'</select></label>'+
   '</div>';
}
function listHTML(){
  return '<div class="tools"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
   '<input id="q" type="search" placeholder="Buscar convidado" autocomplete="off" enterkeyhint="search" value="'+esc(ui.q)+'" aria-label="Buscar convidado">'+
   '<button class="clear" data-act="clearq" aria-label="Limpar busca" '+(ui.q?'':'hidden')+'>×</button></label>'+
   '<div id="fil">'+filHTML()+'</div></div><div id="results">'+resultsHTML()+'</div>';
}
function refreshList(){var f=$("#fil"),r=$("#results");if(f)f.innerHTML=filHTML();if(r)r.innerHTML=resultsHTML();var c=$(".search .clear");if(c)c.hidden=!ui.q}
function resultsHTML(){
  var h='';
  var list=sorted().filter(function(g){return passes(g)});
  h+='<div class="resbar"><span>'+(filtersActive()?'Mostrando '+list.length+' de '+S.guests.length:S.guests.length+' convidados')+'</span>'+
     '<span>'+(filtersActive()?'<button class="linkbtn" data-act="reset">Limpar filtros</button>':'')+
     (list.length&&!readOnly?' <button class="linkbtn" data-act="bulk" style="margin-left:14px">Marcar vários</button>':'')+'</span></div>';
  if(!list.length){
    h+='<div class="empty">'+(S.guests.length?'Ninguém aparece com esses filtros.<br><button class="btn" data-act="reset">Limpar filtros</button>':'A lista está vazia.<br><button class="btn primary" data-act="new">Adicionar convidado</button>')+'</div>';
    return h;
  }
  var cur="",out=[];
  list.forEach(function(g){
    var L=norm(g.nome).charAt(0).toUpperCase();
    if(L!==cur){ if(cur) out.push('</ul>'); cur=L; out.push('<div class="letter" aria-hidden="true">'+esc(L)+'</div><ul class="list">'); }
    var meta=g.cat+", "+g.faixa.toLowerCase()+(g.mesa?", mesa "+g.mesa:"");
    out.push('<li class="g" data-id="'+g.id+'"><button class="g-main" data-act="open"><span class="g-name">'+esc(g.nome)+'</span><span class="g-meta">'+esc(meta)+'</span>'+
     '<span class="g-flags"><span class="'+(g.std?'on':'')+'">'+(g.std?'✓':'○')+' Save the Date</span><span class="'+(g.conv?'on':'')+'">'+(g.conv?'✓':'○')+' Convite</span>'+'</span></button>'+
     '<button class="rsvp" data-act="cycle" data-s="'+esc(g.rsvp)+'" '+(readOnly?'disabled':'')+' aria-label="Presença de '+esc(g.nome)+': '+esc(g.rsvp)+'. Toque para mudar.">'+esc(g.rsvp)+'</button></li>');
  });
  out.push('</ul>');
  return h+out.join("");
}

function summaryHTML(){
  var G=S.guests,n=G.length,c=counts(G);
  var adultos=G.filter(function(g){return g.faixa==="Adulto"}).length;
  var std=G.filter(function(g){return g.std}).length, conv=G.filter(function(g){return g.conv}).length;
  var row=function(l,q){return '<tr><td>'+l+'</td><td>'+q+'</td><td>'+pct(q,n)+'</td></tr>'};
  var h='<section class="sum"><h2>Visão geral</h2><div class="tbl"><table><thead><tr><th>Item</th><th>Qtde</th><th>% do total</th></tr></thead><tbody>'+
    '<tr class="tot"><td>Total de convidados</td><td>'+n+'</td><td>100%</td></tr>'+
    row("Adultos",adultos)+row("Crianças (todas as faixas)",n-adultos)+row("Save the Date enviado",std)+row("Convite formal enviado",conv)+
    row("Confirmados",c.Confirmado)+row("Pendentes",c.Pendente)+row("Não vão",c["Não vai"])+'</tbody></table></div>';

  h+='<h2>Por categoria</h2><div class="tbl"><table><thead><tr><th>Categoria</th><th>Evillyn</th><th>Maicon</th><th>Total</th><th>Confirmados</th><th>%</th></tr></thead><tbody>';
  var te=0,tm=0,tc=0;
  CATS.forEach(function(cat){
    var L=G.filter(function(g){return g.cat===cat});
    var e=L.filter(function(g){return g.resp==="Evillyn"}).length, m=L.length-e, cf=L.filter(function(g){return g.rsvp==="Confirmado"}).length;
    te+=e;tm+=m;tc+=cf;
    h+='<tr><td>'+esc(cat)+'</td><td>'+e+'</td><td>'+m+'</td><td>'+L.length+'</td><td>'+cf+'</td><td>'+pct(L.length,n)+'</td></tr>';
  });
  h+='<tr class="tot"><td>Total</td><td>'+te+'</td><td>'+tm+'</td><td>'+(te+tm)+'</td><td>'+tc+'</td><td>'+pct(te+tm,n)+'</td></tr></tbody></table></div>';

  h+='<h2>Por faixa etária</h2><div class="tbl"><table><thead><tr><th>Faixa etária</th><th>Total</th><th>Confirmados</th><th>Pendentes</th><th>Não vão</th></tr></thead><tbody>';
  var ft={t:0,c:0,p:0,n:0};
  FAIXAS.forEach(function(f){
    var L=G.filter(function(g){return g.faixa===f}), k=counts(L);
    ft.t+=L.length;ft.c+=k.Confirmado;ft.p+=k.Pendente;ft.n+=k["Não vai"];
    h+='<tr><td>'+esc(f)+'</td><td>'+L.length+'</td><td>'+k.Confirmado+'</td><td>'+k.Pendente+'</td><td>'+k["Não vai"]+'</td></tr>';
  });
  h+='<tr class="tot"><td>Total</td><td>'+ft.t+'</td><td>'+ft.c+'</td><td>'+ft.p+'</td><td>'+ft.n+'</td></tr></tbody></table></div>';


  var mesas={};G.forEach(function(g){if(g.mesa){(mesas[g.mesa]=mesas[g.mesa]||[]).push(g)}});
  var mk=Object.keys(mesas).sort(function(a,b){return a.localeCompare(b,"pt-BR",{numeric:true})});
  h+='<h2>Mesas</h2>'+(mk.length?'<ul class="pill-list">'+mk.map(function(k){return '<li>Mesa '+esc(k)+' ('+mesas[k].length+')<small>'+mesas[k].map(function(g){return esc(g.nome)}).join(", ")+'</small></li>'}).join("")+'</ul>':'<p class="note">Nenhuma mesa definida ainda. Abra um convidado e preencha o campo Mesa.</p>');

  h+='<h2>Exportar</h2><p class="note">Baixe a lista completa em CSV para abrir no Excel ou no Google Planilhas.</p><div class="actions"><button class="btn" data-act="csv">Baixar lista (.csv)</button></div></section>';
  return h;
}

function navHTML(){
  return '<nav class="nav" aria-label="Seções"><div class="nav-in" role="tablist">'+
   '<button class="tab" role="tab" data-tab="lista" aria-selected="'+(ui.tab==="lista")+'">Convidados</button>'+
   '<button class="tab" role="tab" data-tab="resumo" aria-selected="'+(ui.tab==="resumo")+'">Resumo</button>'+
   '<button class="add" data-act="new" '+(readOnly?'hidden':'')+'>+ Adicionar</button></div></nav>';
}

function render(keepFocus){
  var root=$("#root"), focusId=null, sel=null;
  var ae=document.activeElement;
  if(ae&&ae.id==="q"){focusId="q";sel=ae.selectionStart}
  root.innerHTML='<div class="wrap">'+heroHTML()+'<main>'+(ui.tab==="lista"?listHTML():summaryHTML())+'</main></div>'+navHTML()+'<div class="toast" id="toast" role="status" aria-live="polite"></div>';
  if(focusId){var q=$("#q");q.focus();try{q.setSelectionRange(sel,sel)}catch(e){}}
  setStatus(readOnly?"ro":dirty?"pending":"saved");
}

var tt;
function toast(msg){var t=$("#toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2600)}

/* ---------- Folha de edição ---------- */
function seg(name,list,cur,cls){
  return '<div class="seg '+(cls||'')+'" data-seg="'+name+'" role="group">'+list.map(function(v){return '<button type="button" data-v="'+esc(v)+'" aria-pressed="'+(v===cur)+'">'+esc(v)+'</button>'}).join("")+'</div>';
}
function openSheet(g,isNew){
  if(readOnly&&isNew) return;
  sheetOpen=true;
  var d=Object.assign({},g);
  var dis=readOnly?' disabled':'';
  var tel=(d.tel||"").replace(/\D/g,"");
  var sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>'+
   '<h3 id="sh-t">'+(isNew?'Novo convidado':esc(d.nome))+'</h3><div class="form">'+
   '<label class="field">Nome<input id="f-nome" value="'+esc(d.nome)+'" autocomplete="off"'+dis+'></label>'+
   '<div class="field">Presença'+seg("rsvp",RSVPS,d.rsvp,"rs")+'</div>'+
   '<div><label class="sw">Save the Date enviado<input type="checkbox" id="f-std" '+(d.std?'checked':'')+dis+'></label>'+
   '<label class="sw">Convite formal enviado<input type="checkbox" id="f-conv" '+(d.conv?'checked':'')+dis+'></label></div>'+
   '<div class="field">Responsável'+seg("resp",RESPS,d.resp)+'</div>'+
   '<div class="field">Faixa etária'+seg("faixa",FAIXAS,d.faixa)+'</div>'+
   '<label class="field">Categoria<select id="f-cat"'+dis+'>'+CATS.map(function(c){return '<option'+(c===d.cat?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select></label>'+
   '<div class="two"><label class="field">Telefone<input id="f-tel" type="tel" inputmode="tel" value="'+esc(d.tel||"")+'" placeholder="(43) 99999-9999"'+dis+'></label>'+
   '<label class="field">Mesa<input id="f-mesa" value="'+esc(d.mesa||"")+'" inputmode="numeric"'+dis+'></label></div>'+
   (tel.length>=10?'<a class="wa" href="https://wa.me/55'+tel.replace(/^55(?=\d{10,11}$)/,"")+'" target="_blank" rel="noopener">Abrir conversa no WhatsApp</a>':'')+
   '<label class="field">Observações<textarea id="f-obs"'+dis+'>'+esc(d.obs||"")+'</textarea></label>'+
   '</div><div class="sheet-foot">'+
   (isNew||readOnly?'<span></span>':'<button class="btn danger" data-act="del">Excluir</button>')+
   (readOnly?'<button class="btn primary" data-act="close">Fechar</button>':'<span style="display:flex;gap:10px"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save">'+(isNew?'Adicionar':'Salvar')+'</button></span>')+
   '</div></div>';
  document.body.appendChild(sc);
  document.body.style.overflow="hidden";
  requestAnimationFrame(function(){sc.classList.add("show")});
  if(isNew) setTimeout(function(){$("#f-nome",sc).focus()},250);
  sc.addEventListener("click",function(e){
    if(e.target===sc){close();return}
    var b=e.target.closest("button"); if(!b) return;
    var sg=b.closest("[data-seg]");
    if(sg&&!readOnly){ d[sg.dataset.seg]=b.dataset.v; sg.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)}); return }
    var a=b.dataset.act;
    if(a==="close") close();
    if(a==="save") save();
    if(a==="del"){
      if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toque de novo para excluir";return}
      S.guests=S.guests.filter(function(x){return x.id!==d.id}); close(); changed(); render(); toast(d.nome+" foi removido da lista");
    }
  });
  sc.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
  function save(){
    var nome=$("#f-nome",sc).value.trim();
    if(!nome){$("#f-nome",sc).focus();toast("Escreva o nome do convidado");return}
    d.nome=nome; d.std=$("#f-std",sc).checked; d.conv=$("#f-conv",sc).checked; d.cat=$("#f-cat",sc).value;
    d.tel=$("#f-tel",sc).value.trim(); d.mesa=$("#f-mesa",sc).value.trim(); d.obs=$("#f-obs",sc).value.trim();
    if(isNew){S.guests.push(d)} else {var i=S.guests.findIndex(function(x){return x.id===d.id}); if(i>=0) S.guests[i]=d}
    close(); changed(); render(); toast(isNew?nome+" foi adicionado":"Alterações salvas");
  }
  function close(){
    sheetOpen=false; document.body.style.overflow="";
    sc.classList.remove("show"); setTimeout(function(){sc.remove()},200);
    if(dirty&&mode==="artifact") schedule(700);
  }
}

function openBulk(){
  var list=sorted().filter(function(g){return passes(g)});
  sheetOpen=true;
  var sc=document.createElement("div"); sc.className="scrim";
  sc.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bk-t"><div class="grab"></div><h3 id="bk-t">Marcar '+list.length+' convidados</h3>'+
   '<p class="note" style="color:var(--muted);margin:-4px 0 14px">Vale para quem está aparecendo na lista agora, com a busca e os filtros atuais.</p><div class="form">'+
   '<button class="btn" data-b="std">Save the Date enviado para todos</button>'+
   '<button class="btn" data-b="conv">Convite formal enviado para todos</button>'+
   '<button class="btn" data-b="Confirmado">Marcar todos como confirmados</button>'+
   '<button class="btn" data-b="Pendente">Voltar todos para pendente</button>'+
   '</div><div class="sheet-foot"><span></span><button class="btn primary" data-b="close">Fechar</button></div></div>';
  document.body.appendChild(sc); document.body.style.overflow="hidden";
  requestAnimationFrame(function(){sc.classList.add("show")});
  function close(){sheetOpen=false;document.body.style.overflow="";sc.classList.remove("show");setTimeout(function(){sc.remove()},200);if(dirty&&mode==="artifact")schedule(700)}
  sc.addEventListener("click",function(e){
    if(e.target===sc){close();return}
    var b=e.target.closest("button[data-b]"); if(!b) return;
    var k=b.dataset.b; if(k==="close"){close();return}
    var ids={}; list.forEach(function(g){ids[g.id]=1});
    S.guests.forEach(function(g){ if(!ids[g.id]) return; if(k==="std") g.std=true; else if(k==="conv") g.conv=true; else g.rsvp=k; });
    close(); changed(); render(); toast(list.length+" convidados atualizados");
  });
}

/* ---------- CSV ---------- */
function csv(){
  var head=["Convidado","Faixa etária","Categoria","Responsável","Save the Date enviado","Convite formal enviado","RSVP","Telefone","Mesa","Observações"];
  var q=function(v){v=String(v==null?"":v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[head].concat(sorted().map(function(g){return [g.nome,g.faixa,g.cat,g.resp,g.std?"Sim":"Não",g.conv?"Sim":"Não",g.rsvp,g.tel,g.mesa,g.obs]}));
  var text="\uFEFF"+rows.map(function(r){return r.map(q).join(";")}).join("\r\n");
  var name="lista-convidados-evillyn-maicon.csv";
  var c=window.claude;
  var fallback=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)};
  if(c&&typeof c.use==="function"){
    c.use("downloads").then(function(dl){ if(!dl){fallback();return} dl.save({filename:name,data:text}).then(function(r){if(r&&r.status==="saved")toast("Lista baixada")},function(e){ if(e&&e.code==="unavailable") toast("Download indisponível nesta visualização"); }) },fallback);
  } else fallback();
}

/* ---------- Eventos ---------- */
document.addEventListener("click",function(e){
  if(e.target.closest(".scrim")) return;
  var t=e.target.closest("[data-tab]");
  if(t){ui.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  var c=e.target.closest("[data-f]");
  if(c){var f=c.dataset.f,v=c.dataset.v; ui[f]=(ui[f]===v&&v!=="Todos")?"Todos":v; refreshList(); return}
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.dataset.act, li=b.closest("[data-id]"), g=li&&S.guests.find(function(x){return x.id===li.dataset.id});
  if(a==="open"&&g) openSheet(g,false);
  else if(a==="cycle"&&g&&!readOnly){ g.rsvp=RSVPS[(RSVPS.indexOf(g.rsvp)+1)%3]; changed(); render(); }
  else if(a==="new") openSheet({id:uid(),nome:"",faixa:"Adulto",cat:CATS[0],resp:ui.resp!=="Todos"?ui.resp:"Evillyn",std:false,conv:false,rsvp:"Pendente",tel:"",mesa:"",rest:"",obs:""},true);
  else if(a==="more"){ui.more=!ui.more;refreshList()}
  else if(a==="reset"){ui.q="";ui.resp="Todos";ui.rsvp="Todos";ui.cat="Todas";ui.faixa="Todas";ui.std="Todos";ui.conv="Todos";var qi=$("#q");if(qi)qi.value="";refreshList()}
  else if(a==="clearq"){ui.q="";$("#q").value="";refreshList();$("#q").focus()}
  else if(a==="bulk") openBulk();
  else if(a==="csv") csv();
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;refreshList()}
});
document.addEventListener("change",function(e){
  var s=e.target.closest("[data-sel]"); if(s){ui[s.dataset.sel]=s.value;refreshList();return}
  var p=e.target.closest("[data-price]");
  if(p&&!readOnly){var v=Math.max(0,parseFloat(String(p.value).replace(",","."))||0);S.precos[p.dataset.price]=v;changed();render()}
});

render();
if(ui._scroll){var y=ui._scroll;delete ui._scroll;requestAnimationFrame(function(){window.scrollTo(0,y)})}
try{sessionStorage.removeItem("cv-ui")}catch(e){}
initStore();
})();
</script>
</body>
</html>
